<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css" />
    <link rel="stylesheet" href="../css/page-roadmap.css" />
    <title>Task Management - Roadmap</title>
          <link rel="icon" type="image/svg" href="../image/check-to-slot-solid.svg">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-white" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-3 primary-text fs-5 fw-bold text-uppercase border-bottom" id="management">
                <img src="../image/logo.png" alt="Logo" class="logo-manage">Management
            </div>
            <div class="list-group list-group-flush my-2">
                <a href="../page/page-backlog.html" class="list-group-item list-group-item-action bg-transparent second-text d-flex align-items-center">
                    <ion-icon name="newspaper-outline" class="me-2 fs-4"></ion-icon>Backlog
                </a>
                <a href="../page/page-new-project.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold d-flex align-items-center">
                    <ion-icon name="document-text-outline" class="me-2 fs-4"></ion-icon>New Project
                </a>
                <a href="../page/page-roadmap.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold active d-flex align-items-center">
                    <ion-icon name="map-outline" class="me-2 fs-4"></ion-icon>Roadmap
                </a>
                <a href="../page/page-setting.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold d-flex align-items-center">
                    <ion-icon name="settings-outline" class="me-2 fs-4"></ion-icon>Setting
                </a>
            </div>
        </div>
        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-4 px-4">
                <div class="d-flex align-items-center">
                    <i class="fas fa-align-left primary-text fs-4 me-3" id="menu-toggle"></i>
                    <h2 class="project-setting fs-2 m-0" id="name-task">Roadmap</h2>
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item dropdown">
                            <a href="#" class="text-primary" data-bs-toggle="modal" data-bs-target="#signOutModal">
                                <img src="../image/imglogo.png" alt="Profile">
                            </a>
                            <!-- Sign Out Modal -->
                            <div class="modal fade" id="signOutModal" tabindex="-1" aria-labelledby="signOutModalLabel" aria-hidden="true">
                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content rounded-4 shadow-lg border-0">
                                        <div class="modal-header">
                                            <h5 class="modal-title text-white" id="signOutModalLabel">Your Profile</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body text-center">
                                            <img src="../image/imglogo.png" alt="User Profile" class="rounded-circle mb-4 border border-4 border-white" width="120" height="120">
                                            <h5 class="mb-2 text-dark">Horth Heng</h5>
                                            <p class="text-muted mb-3">horth.heng@gmail.com</p>
                                            <p class="text-dark font-italic">Your profile is ready to go!</p>
                                        </div>
                                        <div class="modal-footer border-0">
                                            <button type="button" class="btn btn-danger w-100 py-2 rounded-pill hover-shadow">
                                                <a href="../index.html" class="text-light text-decoration-none">Sign Out</a>
                                            </button>
                                            <button type="button" class="btn btn-outline-dark w-100 py-2 rounded-pill hover-shadow" data-bs-dismiss="modal">Close</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
            <div class="container-fluid px-5">
                <main class="main-content">
                    <section>
                        <!-- Tabs -->
                        <ul class="nav nav-tabs mb-4" id="roadmapTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="calendar-tab" data-bs-toggle="tab" data-bs-target="#calendar-view" type="button" role="tab" aria-controls="calendar-view" aria-selected="true">Calendar</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="board-tab" data-bs-toggle="tab" data-bs-target="#board-view" type="button" role="tab" aria-controls="board-view" aria-selected="false">Board</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="roadmap-tab" data-bs-toggle="tab" data-bs-target="#roadmap-view" type="button" role="tab" aria-controls="roadmap-view" aria-selected="false">Roadmap</button>
                            </li>
                        </ul>
                        <!-- Tab Content -->
                        <div class="tab-content" id="roadmapTabContent">
                            <!-- Calendar View -->
                            <div class="tab-pane fade show active" id="calendar-view" role="tabpanel" aria-labelledby="calendar-tab">
                                <div id="calendar"></div>
                            </div>
                            <!-- Board View -->
                            <div class="tab-pane fade" id="board-view" role="tabpanel" aria-labelledby="board-tab">
                                <div class="board-container d-flex">
                                    <div class="board-column" data-status="Backlog">
                                        <h4>Backlog</h4>
                                        <div class="task-list" data-status="Backlog"></div>
                                    </div>
                                    <div class="board-column" data-status="In Progress">
                                        <h4>In Progress</h4>
                                        <div class="task-list" data-status="In Progress"></div>
                                    </div>
                                    <div class="board-column" data-status="Done">
                                        <h4>Done</h4>
                                        <div class="task-list" data-status="Done"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Roadmap View -->
                            <div class="tab-pane fade" id="roadmap-view" role="tabpanel" aria-labelledby="roadmap-tab">
                                <div class="roadmap-container">
                                    <div class="roadmap-timeline">
                                        <div class="timeline-header">
                                            <span>Today</span>
                                        </div>
                                        <div class="timeline-body"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </main>
            </div>
        </div>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="../js/page-roadmap.js"></script>
</body>
</html>
